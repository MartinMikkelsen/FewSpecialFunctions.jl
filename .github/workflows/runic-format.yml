name: Runic formatting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: fredrikekre/runic-action@v1
        with:
          version: "1"
          format_files: true
        continue-on-error: true

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automated/runic-format
          delete-branch: true
          commit-message: Format Julia code with Runic
          title: Format Julia code with Runic
          body: Automated formatting generated by Runic.jl.
